[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gistic-compare"
version = "0.1.0"
description = "Compare GISTIC 2.0 results across cohorts and processing variants"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Li Bingwu" },
]
keywords = [
    "gistic", "copy-number", "scna", "bioinformatics",
    "snp-array", "genomics", "benchmark",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "statsmodels>=0.14",
    "h5py>=3.8",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.4",
]

[project.scripts]
gistic-compare = "gistic_compare.cli:main"

[project.urls]
Homepage = "https://github.com/lbwfff/gistic-compare"
Issues = "https://github.com/lbwfff/gistic-compare/issues"
Documentation = "https://github.com/lbwfff/gistic-compare#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gistic_compare = ["data/refs/*.tsv"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # long lines in the plotting/stat code are mostly fine
    "UP015", # explicit open() modes are fine
    "E702",  # compact `a; b` statements from the original codebase
    "B905",  # zip() without strict= — semantics must not change silently
    "B007",  # unused loop variables (kept for readability of the original code)
    "E741",  # short math-style variable names in stats code
    "F841",  # unused locals; cleanup scheduled after the first release
]

[tool.ruff.lint.per-file-ignores]
# the plotting package intentionally re-exports a shared namespace via star
# imports and keeps some compact original style
"src/gistic_compare/plotting/*" = ["F403", "F405", "E702", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]
