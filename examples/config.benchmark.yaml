# Example: benchmark workflow (star topology, control_vs_all)
#
# Copy this file next to your data (or anywhere — paths resolve relative to
# the config file) and edit the cohort table.
#
# Every experiment is compared against the control cohort. Module G needs a
# reference panel; enable it once you have filled in your own numbers
# (see presets/reference_panels/we_lung.yaml for the schema).

workflow: benchmark
genome: hg19

# directory that contains the cohort folders
data_root: /path/to/data

# outputs go to <results>/eval_run/{tables,figures} next to this config
# (or pass --outdir)
run_id: eval_run

comparison_mode: control_vs_all
control: ref                      # cohort id used as the control

cohorts:
  ref:  {label: "Reference (TCGA)", path: REFERENCE, prefix: REF}
  exp1: {label: "Experiment 1", path: EXP1, prefix: exp1}
  exp2: {label: "Experiment 2", path: EXP2, prefix: exp2}

analysis:
  q_thresholds: [0.25, 0.05]      # main / sensitivity
  peak_limit_field: wide_peak     # wide_peak | peak | region
  overlap:
    min_bp: 50
    reciprocal_shorter: 0.5       # moderate tier: shorter peak covered >= 50%
    reciprocal_both: 0.5          # strict tier: both directions
    default_tier: moderate
  permutation: {n: 2000, seed: 42}
  bootstrap: {n: 2000, seed: 42, ci: 0.95}
  score_track: {bin_size: 1000000}
  fga:
    log2_threshold: 0.2
    log2_threshold_sens: 0.3
  genes:
    max_wide_len_mb_amp: 30
    max_wide_len_mb_del: 10
  drivers: [EGFR, KRAS, TP53, MYC, CCND1]   # your cancer-type driver panel

# optional: benchmark against a reference series (module G)
# paper_benchmark:
#   enabled: true
#   panel: presets/reference_panels/we_lung.yaml

output:
  figure:
    style: paper
    palette: okabe_ito
    width_in: 7.0
    dpi: 600
    rasterize_tracks: false
    panel_labels: false
    # cohort_colors: {exp1: "#E69F00", exp2: "#0072B2"}
