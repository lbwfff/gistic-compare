# Example: pairwise workflow (cohort vs cohort, no control)
#
# Copy this file, point data_root at your GISTIC output directories, list two
# or more cohorts, and run:
#
#   gistic-compare --config config.pairwise.yaml --all
#
# All modules run independently; one failing module does not abort the rest
# (unless --fail-fast). P4's marker-matrix layer (the P5_* tables) and GS
# additionally need <prefix>.D.cap1.5.mat and are skipped with a notice when
# it is missing; disable the marker layer with
# analysis.regional.marker_matrix: false. P8 needs scikit-learn.

workflow: pairwise
genome: hg19

data_root: /path/to/data
run_id: my_comparison
comparison_mode: experiment_pairs   # all unordered pairs; kind auto-detected

cohorts:
  expA: {label: "Cohort A", path: cohortA, prefix: A}
  expB: {label: "Cohort B", path: cohortB, prefix: B}

# optional: sample-level metadata for module P3 (altered ~ covariates).
# Missing file -> P3 is skipped.
# metadata:
#   path: meta/sample_meta.tsv     # relative to data_root
#   sample_id: sample              # column matching GISTIC sample IDs
#   covariates: [sex, age_group]

# optional: confounder sensitivity (CF) — needs only per-cohort marginals.
# CF bounds what a confounder could explain; it does not adjust for it.
# confounding:
#   sources: [P4, P5]   # P5_* = P4's marker-matrix layer
#   smoking_unknown: drop
#   delta_grid: [0.02, 0.05, 0.10, 0.20]
#   age_grid: [0.001, 0.002, 0.005, 0.010]
#   plausible_max_binary: 0.20
#   plausible_max_age: 0.01
#   cohorts:
#     expA: {sex: {male: 100, female: 36}, age_median: 63,
#            smoking: {smoker: 123, nonsmoker: 13, unknown: 0},
#            mutations: {EGFR: 15, KRAS: 28, TP53: 41}}
#     expB: {sex: {male: 49, female: 41}, age_median: 66,
#            smoking: {smoker: 37, nonsmoker: 35, unknown: 18},
#            mutations: {EGFR: 29, KRAS: 9, TP53: 27}}

analysis:
  q_thresholds: [0.25, 0.05]
  paired_frac: 0.8                # sample-ID overlap fraction -> paired
  peak_limit_field: wide_peak
  overlap:
    min_bp: 50
    reciprocal_shorter: 0.5
    reciprocal_both: 0.5
    default_tier: moderate
  permutation: {n: 2000, seed: 42}
  bootstrap: {n: 2000, seed: 42, ci: 0.95}
  score_track: {bin_size: 1000000}
  regional:                       # P4; GS and P4's marker layer share thresholds
    # marker_matrix: false        # skip the P5_* marker-matrix layer
    bin_size: 1000000
    amp_thr: 0.1
    del_thr: -0.1
    excl_freq_min: 0.10
    excl_freq_max: 0.05
    fdr: 0.05
    null_splits: 20
    seed: 42
    # cytoband_file: refs/hg19.mat       # optional; bundled tables by default
    # refgene_file: refs/refgene.hg19.mat
    # loci_set: presets/loci_sets/we_ea.yaml   # named loci + bookmarked bands
  gscore:
    cap: 1.5
    method: normal                # normal = exact SD + normal tail; or mc
    perm: 2000
    seed: 42
  # P6: arm-level broad landscape. GISTIC's broad_values_by_arm.txt is used
  # when present in every cohort; otherwise arm calls are derived from
  # tumors.seg with these thresholds.
  # broad:
  #   amp_thr: 0.3
  #   del_thr: -0.3
  #   min_frac: 0.5
  # P7: amplitude among altered samples (GISTIC's own 0.1 / 0.9 thresholds).
  # amplitude:
  #   amp_thr: 0.1
  #   del_thr: -0.1
  #   high_amp: 0.9
  #   high_del: -0.9
  #   fdr: 0.05
  # P8: multivariate separation (needs scikit-learn).
  # multivariate:
  #   features: grid              # grid | cytoband | peaks (peaks = circular)
  #   n_perm: 999                 # PERMANOVA permutations
  #   n_auc_perm: 100             # AUC permutation null
  #   n_boot: 50                  # stability-selection refits
  #   top_k: 20
  #   penalty: l2                 # l2 | elasticnet
  #   min_n: 5
  # P9: three-level SCNA burden (Yuan et al. 2018 parameterisation).
  # burden:
  #   arm_thr: 0.25               # amplitude threshold for events
  #   arm_min_frac: 0.70          # >70% of the arm's length = broad event
  #   arm_match_diff: 0.10        # two arms "same value" = log2 diff < 0.1
  #   focal_thr: 0.25
  #   focal_broad_overlap_max: 0.5
  #   sensitivity: true           # 81-combo parameter grid (slower)
  # PD: baseline/batch diagnostic for the lambda inflation.
  # diag:
  #   neutral_band: 0.25          # |seg_mean| < band = neutral segments
  #   smooth_windows: 20          # rolling mean of the shift track
  # P10: burden-controlled permutation on peaks.
  # permtest:
  #   cn_thr: 0.25
  #   n_perm: 10000
  #   stat: zprop                 # zprop (vectorised, no covariates) | wald
  #   exclude_centromere_telomere: true
  #   max_segments: 2000
  # PQ needs no config: it QC's every p-value set the run has produced.
  # ABS: absolute copy-number extension (needs raw SNP6 logR/BAF + R/ASCAT).
  # absolute_cn:
  #   tool: ascat
  #   raw_dir: raw_snp6/           # marker-level logR/BAF dir (vs data_root)
  #   manifest: absolute_manifest.tsv
  #   # manifest columns: sample, cohort, logr, baf
  #   #                  [, germline_logr, germline_baf   (matched normal)
  #   #                   | het_calls]                    (Birdseed AA/AB/BB;
  #   #                    tumour-only het proxy — paths vs manifest)
  #   gc_file: ref/GC_AffySNP6_102015.txt.gz   # SNP6 GC correction (Zenodo
  #                                            # 14008443) — required for
  #                                            # HAPMAP-normalised logR
  #   jobs: 4                          # parallel R workers per cohort
  #   r_timeout_min_per_sample: 90     # per-worker subprocess budget
  #   cn_thr_wgd: 3.0              # WGD heuristic A total-CN threshold
  #   loh_frac_wgd: 0.30           # heuristic A genome fraction (sens 0.2-0.5)
  #   min_purity: 0.30             # R05 4.5 low-purity flag
  #   ploidy_wgd: 3.7              # heuristic B (classical ploidy rule)
  #   penalty: 70                  # ascat.aspcf segmentation penalty
  #   gamma: 0.55                  # ascat.runAscat logR scaling

output:
  figure:
    style: paper
    palette: okabe_ito
    width_in: 7.0
    dpi: 600
    rasterize_tracks: false
